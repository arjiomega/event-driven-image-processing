services:

  minio:
    image: minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_NOTIFY_AMQP_ENABLE_primary: ${MINIO_NOTIFY_AMQP_ENABLE_primary}
      MINIO_NOTIFY_AMQP_URL_primary: ${MINIO_NOTIFY_AMQP_URL_primary}
      MINIO_NOTIFY_AMQP_EXCHANGE_primary: ${MINIO_NOTIFY_AMQP_EXCHANGE_primary}
      MINIO_NOTIFY_AMQP_EXCHANGE_TYPE_primary: ${MINIO_NOTIFY_AMQP_EXCHANGE_TYPE_primary}
      MINIO_NOTIFY_AMQP_DURABLE_primary: ${MINIO_NOTIFY_AMQP_DURABLE_primary}
    volumes:
      - minio-volume:/data
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_WEBUI_PORT}:9001"
    command: [ "server", "--console-address", ":9001", "/data" ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/raw-uploads &&
      mc mb --ignore-existing local/processed-output &&
      mc anonymous set download local/processed-output &&
      mc event add local/raw-uploads arn:minio:sqs::primary:amqp --event put
      "

  rabbitmq:
    image: rabbitmq:4.3-management
    container_name: rabbitmq
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_WEBUI_PORT}:15672"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3

  frontend:
    container_name: frontend
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://backend:${BACKEND_PORT}
    ports:
      - "3000:80"
    depends_on:
      - backend
    profiles:
      - include_frontend

  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT}:8000"
    environment:
      CORS_ORIGINS: '["http://localhost:3000"]'
      S3_BUCKET_NAME: raw-uploads
      S3_PUBLIC_ENDPOINT: localhost:${MINIO_API_PORT}
      S3_INTERNAL_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION: ${S3_REGION}
      S3_REQUIRE_TLS: ${S3_REQUIRE_TLS}
      IS_PROXY_REQUIRED: ${IS_PROXY_REQUIRED}
    depends_on:
      - minio
    volumes:
      - ./backend/app:/app/app
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload"
      ]

  worker:
    container_name: worker
    build:
      context: ./worker
      dockerfile: Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672
      S3_BUCKET_NAME: raw-uploads
      S3_PUBLIC_ENDPOINT: localhost:${MINIO_API_PORT}
      S3_INTERNAL_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION: ${S3_REGION}
      S3_REQUIRE_TLS: ${S3_REQUIRE_TLS}
      IS_PROXY_REQUIRED: ${IS_PROXY_REQUIRED}

  consumer:
    container_name: consumer
    build:
      context: ./events
      dockerfile: Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672
      AMQP_HOST: rabbitmq
      AMQP_EXCHANGE: ${AMQP_EXHANGE}
      AMQP_EXCHANGE_TYPE: ${AMQP_EXCHANGE_TYPE}
      AMQP_QUEUE: ${AMQP_QUEUE}


volumes:
  minio-volume:
