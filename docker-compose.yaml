services:


  minio:
    image: minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_NOTIFY_AMQP_ENABLE_primary: ${MINIO_NOTIFY_AMQP_ENABLE_primary}
      MINIO_NOTIFY_AMQP_URL_primary: ${MINIO_NOTIFY_AMQP_URL_primary}
      MINIO_NOTIFY_AMQP_EXCHANGE_primary: ${MINIO_NOTIFY_AMQP_EXCHANGE_primary}
      MINIO_NOTIFY_AMQP_EXCHANGE_TYPE_primary: ${MINIO_NOTIFY_AMQP_EXCHANGE_TYPE_primary}
      MINIO_NOTIFY_AMQP_DURABLE_primary: ${MINIO_NOTIFY_AMQP_DURABLE_primary}
    volumes:
      - minio-volume:/data
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_WEBUI_PORT}:9001"
    command: [ "server", "--console-address", ":9001", "/data" ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/raw-uploads &&
      mc mb --ignore-existing local/processed-output &&
      mc anonymous set download local/processed-output &&
      mc event add local/raw-uploads arn:minio:sqs::primary:amqp --event put
      "

  rabbitmq:
    image: rabbitmq:4.3-management
    container_name: rabbitmq
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_WEBUI_PORT}:15672"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3


  postgres:
    image: postgres:18
    container_name: postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"

  frontend:
    container_name: frontend
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT}
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT}:8000"
    environment:
      CORS_ORIGINS: '["http://localhost:3000", "http://192.168.1.62:3000"]'
      S3_BUCKET_NAME: raw-uploads
      S3_PUBLIC_ENDPOINT: localhost:${MINIO_API_PORT}
      S3_INTERNAL_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION: ${S3_REGION}
      S3_REQUIRE_TLS: ${S3_REQUIRE_TLS}
      IS_PROXY_REQUIRED: ${IS_PROXY_REQUIRED}
    depends_on:
      - postgres
      - minio
    volumes:
      - ./backend/app:/app/app
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload"
      ]

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      S3_BUCKET_NAME: raw-uploads
      S3_PUBLIC_ENDPOINT: localhost:${MINIO_API_PORT}
      S3_INTERNAL_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION: ${S3_REGION}
      S3_REQUIRE_TLS: ${S3_REQUIRE_TLS}
      IS_PROXY_REQUIRED: ${IS_PROXY_REQUIRED}

  consumer:
    build:
      context: ./events
      dockerfile: Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672
      AMQP_HOST: rabbitmq
      AMQP_EXCHANGE: ${AMQP_EXHANGE}
      AMQP_EXCHANGE_TYPE: ${AMQP_EXCHANGE_TYPE}
      AMQP_QUEUE: ${AMQP_QUEUE}


volumes:
  postgres_data:
  minio-volume:
